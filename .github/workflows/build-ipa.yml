name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madeira-ipa
  cancel-in-progress: true

jobs:
  build:
    name: Build Madeira IPA
    runs-on: macos-15

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      LLVM_MINGW_VERSION: "20260421"
      LLVM_MINGW_DIR: "toolchains/llvm-mingw-20260421-ucrt-macos-universal"

      LLVM_VERSION: "15.0.7"
      LLVM_SRC_DIR: "toolchains/llvm-project"
      LLVM_HOST_DIR: "toolchains/llvm-host-build"
      LLVM_IOS_DIR: "toolchains/llvm-ios-build"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize Xcode
        shell: bash
        run: |
          set -euxo pipefail

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true

          echo "Xcode:"
          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "Available SDKs:"
          xcodebuild -showsdks

      # ============================================================
      # METAL TOOLCHAIN
      # ============================================================

      - name: Check Metal Toolchain
        id: metal-check
        shell: bash
        run: |
          set +e

          echo "Checking for Apple's Metal compiler..."

          METAL="$(xcrun --find metal 2>/dev/null)"
          RESULT=$?

          if [ "$RESULT" -eq 0 ] && [ -x "$METAL" ]; then
            echo "Metal Toolchain already installed."
            echo "Metal: $METAL"
            "$METAL" --version || true

            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Metal Toolchain is not currently available."
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Metal Toolchain
        if: steps.metal-check.outputs.installed != 'true'
        shell: bash
        run: |
          set -euxo pipefail

          echo "Attempting Apple's official Metal Toolchain download..."

          sudo xcodebuild -downloadComponent MetalToolchain

      - name: Verify Metal Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "Locating Metal compiler..."

          METAL="$(xcrun --find metal)"

          if [ ! -x "$METAL" ]; then
            echo "::error::Metal compiler could not be found."
            echo
            echo "Xcode developer directory:"
            xcode-select -p
            echo
            echo "Available Metal-related files:"
            find /Applications/Xcode.app \
              -iname '*Metal*' \
              -maxdepth 8 \
              2>/dev/null | head -200 || true
            exit 1
          fi

          echo "Metal compiler:"
          echo "$METAL"

          "$METAL" --version || true

          METALLIB="$(xcrun --find metallib)"

          echo
          echo "metallib:"
          echo "$METALLIB"

          "$METALLIB" --version || true

      # ============================================================
      # HOMEBREW DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew update

          brew install \
            cmake \
            ninja \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            python \
            sevenzip \
            bison \
            flex

      # ============================================================
      # REPOSITORY SETUP
      # ============================================================

      - name: Update submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

          git submodule status --recursive

      - name: Make scripts executable
        shell: bash
        run: |
          set -euxo pipefail

          find . \
            -type f \
            -name '*.sh' \
            -exec chmod +x {} \;

      - name: Show repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository:"
          ls -la

          echo
          echo "Build scripts:"
          find build \
            -type f \
            -name 'build.sh' \
            -print \
            2>/dev/null | sort || true

          echo
          echo "Xcode project:"
          find app \
            -maxdepth 2 \
            -name '*.xcodeproj' \
            -print 2>/dev/null || true

      # ============================================================
      # MICROSOFT VC RUNTIME
      # ============================================================

      - name: Check Visual C++ runtime
        shell: bash
        run: |
          set -euxo pipefail

          DEST="app/Madeira/x86_64-vcruntime"

          if [ -d "$DEST" ]; then
            echo "Visual C++ runtime directory exists."

            count="$(find "$DEST" -maxdepth 1 -type f -iname '*.dll' | wc -l | tr -d ' ')"

            echo "DLL count: $count"

            if [ "$count" -ge 12 ]; then
              echo "VC runtime appears to be populated."
              exit 0
            fi
          fi

          if [ -f tools/VC_redist.x64.exe ]; then
            echo "Found tools/VC_redist.x64.exe."

            rm -rf /tmp/vcredist
            mkdir -p /tmp/vcredist "$DEST"

            7zz x \
              tools/VC_redist.x64.exe \
              -o/tmp/vcredist

            CAB="$(find /tmp/vcredist \
              -type f \
              -iname '*.cab' \
              | head -n 1)"

            if [ -z "$CAB" ]; then
              echo "::error::VC runtime CAB was not found."
              exit 1
            fi

            7zz x \
              "$CAB" \
              -o"$DEST"

            echo "VC runtime files:"
            find "$DEST" \
              -maxdepth 1 \
              -type f \
              -iname '*.dll' \
              -print

            exit 0
          fi

          echo "::error::Visual C++ runtime is missing."
          echo
          echo "Madeira requires Microsoft's VC runtime DLLs."
          echo "Supply them using the repository's documented method."
          echo
          echo "Expected directory:"
          echo "  $DEST"
          echo
          echo "Or provide:"
          echo "  tools/VC_redist.x64.exe"

          exit 1

      # ============================================================
      # LLVM-MINGW
      # ============================================================

      - name: Install llvm-mingw
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p toolchains

          ARCHIVE="/tmp/llvm-mingw.tar.xz"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-macos-universal.tar.xz" \
            -o "$ARCHIVE"

          rm -rf "$LLVM_MINGW_DIR"

          tar \
            -xJf "$ARCHIVE" \
            -C toolchains

          test -x \
            "$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang"

          test -x \
            "$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang++"

          "$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang" \
            --version

      # ============================================================
      # LLVM 15
      # ============================================================

      - name: Checkout LLVM 15.0.7
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p toolchains

          if [ ! -d "$LLVM_SRC_DIR/.git" ]; then
            git clone \
              --depth 1 \
              --branch "llvmorg-${LLVM_VERSION}" \
              https://github.com/llvm/llvm-project.git \
              "$LLVM_SRC_DIR"
          fi

          cd "$LLVM_SRC_DIR"

          git fetch \
            --tags \
            --depth 1 \
            origin \
            "refs/tags/llvmorg-${LLVM_VERSION}"

          git checkout --force \
            "llvmorg-${LLVM_VERSION}"

      - name: Prepare LLVM for iOS
        shell: bash
        run: |
          set -euxo pipefail

          FILE="$LLVM_SRC_DIR/llvm/cmake/modules/AddLLVM.cmake"

          echo "Checking LLVM patch..."

          if grep -q 'Darwin|iOS' "$FILE"; then
            echo "LLVM iOS patch already present."
            exit 0
          fi

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          old = 'MATCHES "Darwin"'
          new = 'MATCHES "Darwin|iOS"'

          if old not in text:
              raise SystemExit(
                  "Expected LLVM AddLLVM.cmake pattern was not found."
              )

          path.write_text(text.replace(old, new, 1))
          PY

          grep -n 'Darwin|iOS' "$FILE"

      - name: Build host llvm-tblgen
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$LLVM_HOST_DIR"

          cmake \
            -S "$LLVM_SRC_DIR/llvm" \
            -B "$LLVM_HOST_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF

          cmake \
            --build "$LLVM_HOST_DIR" \
            --target llvm-tblgen \
            -j"$(sysctl -n hw.ncpu)"

          test -x \
            "$LLVM_HOST_DIR/bin/llvm-tblgen"

      - name: Build LLVM for iOS
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf "$LLVM_IOS_DIR"

          cmake \
            -S "$LLVM_SRC_DIR/llvm" \
            -B "$LLVM_IOS_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_C_COMPILER="$(xcrun --sdk iphoneos -f clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --sdk iphoneos -f clang++)" \
            -DCMAKE_AR="$(xcrun --sdk iphoneos -f ar)" \
            -DCMAKE_RANLIB="$(xcrun --sdk iphoneos -f ranlib)" \
            -DLLVM_TABLEGEN="$GITHUB_WORKSPACE/$LLVM_HOST_DIR/bin/llvm-tblgen" \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF

          cmake \
            --build "$LLVM_IOS_DIR" \
            -j"$(sysctl -n hw.ncpu)"

          test -d "$LLVM_IOS_DIR/lib"

      # ============================================================
      # BUILD REPOSITORY NATIVE COMPONENTS
      # ============================================================

      - name: List Madeira build scripts
        shell: bash
        run: |
          set -euxo pipefail

          find build \
            -type f \
            -name build.sh \
            -print \
            2>/dev/null \
            | sort

      - name: Build Madeira native components
        shell: bash
        run: |
          set -euxo pipefail

          while IFS= read -r script; do
            echo
            echo "============================================"
            echo "BUILDING: $script"
            echo "============================================"

            "$GITHUB_WORKSPACE/$script"

          done < <(
            find build \
              -type f \
              -name build.sh \
              ! -path 'build/dxmt-ios/build.sh' \
              -print \
              2>/dev/null \
              | sort
          )

      # ============================================================
      # DXMT
      # ============================================================

      - name: Link toolchains into DXMT
        shell: bash
        run: |
          set -euxo pipefail

          if [ -e research/dxmt/toolchains ] && \
             [ ! -L research/dxmt/toolchains ]; then
            rm -rf research/dxmt/toolchains
          fi

          if [ ! -e research/dxmt/toolchains ]; then
            ln -s \
              ../../toolchains \
              research/dxmt/toolchains
          fi

          ls -la research/dxmt/toolchains

      - name: Build DXMT PE modules
        working-directory: research/dxmt
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/$LLVM_MINGW_DIR/bin:$PATH"

          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"

          export SDKROOT

          rm -rf build-pe

          meson setup \
            --cross-file build-aarch64-win.txt \
            --native-file build-osx.txt \
            -Dwine_build_path=../../wine/build-macos \
            build-pe

          meson compile \
            -C build-pe \
            -j"$(sysctl -n hw.ncpu)"

      - name: Build DXMT iOS
        working-directory: build/dxmt-ios
        shell: bash
        run: |
          set -euxo pipefail

          ./build.sh

          test -f libdxmt_unix.a

      - name: Combine DXMT libraries
        working-directory: build/dxmt-ios
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/app/Madeira"

          xcrun -sdk iphoneos libtool \
            -static \
            -o libdxmt_combined.a \
            obj/*.o \
            "$GITHUB_WORKSPACE/$LLVM_IOS_DIR/lib/"*.a

          cp \
            libdxmt_combined.a \
            "$GITHUB_WORKSPACE/app/Madeira/libdxmt_combined.a"

          test -f \
            "$GITHUB_WORKSPACE/app/Madeira/libdxmt_combined.a"

      # ============================================================
      # SHOW BUILD INPUTS
      # ============================================================

      - name: Verify native outputs
        shell: bash
        run: |
          set -euxo pipefail

          echo "DXMT:"
          ls -lh app/Madeira/libdxmt_combined.a

          echo
          echo "FEX:"
          find FEX \
            -type f \
            -name '*.a' \
            -print \
            2>/dev/null \
            | head -100 || true

          echo
          echo "Madeira native libraries:"
          find app/Madeira \
            -maxdepth 2 \
            -type f \
            \( -name '*.a' -o -name '*.dylib' -o -name '*.dll' \) \
            -print \
            2>/dev/null \
            | sort || true

      # ============================================================
      # BUILD XCODE APP
      # ============================================================

      - name: Build Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/DerivedData

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      # ============================================================
      # LOCATE APP
      # ============================================================

      - name: Locate Madeira.app
        id: locate-app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find build/DerivedData \
              -type d \
              -name 'Madeira.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::Madeira.app was not produced."

            echo
            echo "DerivedData:"
            find build/DerivedData \
              -maxdepth 8 \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"

          echo "Found:"
          echo "$APP"

      # ============================================================
      # VERIFY APP
      # ============================================================

      - name: Verify app
        shell: bash
        run: |
          set -euxo pipefail

          APP="${{ steps.locate-app.outputs.app }}"

          test -f "$APP/Madeira"

          echo "Binary:"
          file "$APP/Madeira"

          echo
          echo "Architecture:"
          lipo -info "$APP/Madeira"

          echo
          echo "Bundle:"
          ls -la "$APP"

      # ============================================================
      # CREATE IPA
      # ============================================================

      - name: Create IPA
        shell: bash
        run: |
          set -euxo pipefail

          APP="${{ steps.locate-app.outputs.app }}"

          rm -rf Payload Madeira.ipa

          mkdir -p Payload

          cp -R \
            "$APP" \
            Payload/Madeira.app

          /usr/bin/zip \
            -r \
            -9 \
            Madeira.ipa \
            Payload

          rm -rf Payload

          test -f Madeira.ipa

          echo
          echo "============================================"
          echo "IPA CREATED"
          echo "============================================"

          ls -lh Madeira.ipa

      # ============================================================
      # VERIFY IPA
      # ============================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -euxo pipefail

          unzip -l Madeira.ipa

          unzip -l Madeira.ipa \
            | grep -q 'Payload/Madeira.app/Madeira$'

          echo
          echo "IPA verification successful."

      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload Madeira IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # UPLOAD DIAGNOSTICS IF BUILD FAILS
      # ============================================================

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-build-diagnostics
          path: |
            build/
            app/Madeira/
            research/dxmt/
            FEX/
          if-no-files-found: ignore
          retention-days: 7
