name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madeira-ipa
  cancel-in-progress: true

jobs:
  build:
    name: Build Madeira IPA
    runs-on: macos-15
    timeout-minutes: 120

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      LLVM_MINGW_VERSION: "20260421"
      LLVM_MINGW_DIR: "toolchains/llvm-mingw-20260421-ucrt-macos-universal"

      LLVM_VERSION: "15.0.7"
      LLVM_SRC_DIR: "toolchains/llvm-project"
      LLVM_HOST_DIR: "toolchains/llvm-host-build"
      LLVM_IOS_DIR: "toolchains/llvm-ios-build"

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # XCODE
      # ============================================================

      - name: Initialize Xcode
        shell: bash
        run: |
          set -euxo pipefail

          sudo xcode-select -s "$DEVELOPER_DIR"
          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true

          echo "Xcode:"
          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "Available SDKs:"
          xcodebuild -showsdks

      # ============================================================
      # METAL
      # ============================================================

      - name: Verify Metal toolchain
        shell: bash
        run: |
          set -euxo pipefail

          METAL="$(xcrun --find metal)"
          METALLIB="$(xcrun --find metallib)"

          test -x "$METAL"
          test -x "$METALLIB"

          echo "metal: $METAL"
          "$METAL" --version || true

          echo
          echo "metallib: $METALLIB"
          "$METALLIB" --version || true

      # ============================================================
      # HOMEBREW
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew install \
            cmake \
            ninja \
            meson \
            pkg-config \
            autoconf \
            automake \
            libtool \
            python \
            sevenzip \
            bison \
            flex

      # ============================================================
      # SUBMODULES
      # ============================================================

      - name: Update submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive

      - name: Make scripts executable
        shell: bash
        run: |
          set -euxo pipefail

          find . \
            -type f \
            -name '*.sh' \
            -exec chmod +x {} \;

      # ============================================================
      # VC RUNTIME
      # ============================================================

      - name: Prepare Visual C++ runtime
        shell: bash
        run: |
          set -euxo pipefail

          DEST="$GITHUB_WORKSPACE/app/Madeira/x86_64-vcruntime"
          mkdir -p "$DEST"

          echo "Checking existing VC runtime..."

          EXISTING_COUNT="$(
            find "$DEST" \
              -maxdepth 1 \
              -type f \
              -iname '*.dll' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Existing DLL count: $EXISTING_COUNT"

          if [ "$EXISTING_COUNT" -ge 12 ]; then
            echo "VC runtime already populated."
            exit 0
          fi

          # The repository may provide the redistributable installer.
          INSTALLER="tools/VC_redist.x64.exe"

          if [ ! -f "$INSTALLER" ]; then
            echo "::error::VC_redist.x64.exe is missing."
            echo
            echo "Expected:"
            echo "  $INSTALLER"
            echo
            echo "Or populate:"
            echo "  $DEST"
            exit 1
          fi

          echo "Found VC redistributable:"
          ls -lh "$INSTALLER"

          TMP="$RUNNER_TEMP/vcredist"
          rm -rf "$TMP"
          mkdir -p "$TMP"

          echo
          echo "Extracting redistributable..."

          7zz x \
            "$INSTALLER" \
            "-o$TMP" \
            -y

          echo
          echo "Extracted files:"
          find "$TMP" \
            -type f \
            -maxdepth 8 \
            -print \
            | sort \
            | head -300

          # IMPORTANT:
          # Search recursively. The previous workflow only searched
          # for a CAB in one directory and therefore failed when the
          # redistributable placed it deeper in the extraction tree.

          CAB="$(
            find "$TMP" \
              -type f \
              -iname '*.cab' \
              -print \
              | head -n 1
          )"

          if [ -z "$CAB" ]; then
            echo "::error::VC runtime CAB was not found after extraction."
            echo
            echo "Complete extraction tree:"
            find "$TMP" -type f -print | sort
            exit 1
          fi

          echo
          echo "Using CAB:"
          echo "$CAB"

          CAB_DIR="$RUNNER_TEMP/vcredist-cab"
          rm -rf "$CAB_DIR"
          mkdir -p "$CAB_DIR"

          7zz x \
            "$CAB" \
            "-o$CAB_DIR" \
            -y

          echo
          echo "Searching extracted CAB for runtime DLLs..."

          # Copy DLLs recursively instead of assuming a particular
          # internal Microsoft redistributable directory structure.

          find "$CAB_DIR" \
            -type f \
            -iname '*.dll' \
            -exec cp -f {} "$DEST/" \;

          echo
          echo "VC runtime DLLs:"
          find "$DEST" \
            -maxdepth 1 \
            -type f \
            -iname '*.dll' \
            -print \
            | sort

          COUNT="$(
            find "$DEST" \
              -maxdepth 1 \
              -type f \
              -iname '*.dll' \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "Final DLL count: $COUNT"

          if [ "$COUNT" -lt 12 ]; then
            echo "::error::VC runtime extraction produced only $COUNT DLLs."
            exit 1
          fi

          echo "VC runtime preparation successful."

      # ============================================================
      # LLVM-MINGW
      # ============================================================

      - name: Install llvm-mingw
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p toolchains

          ARCHIVE="$RUNNER_TEMP/llvm-mingw.tar.xz"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-macos-universal.tar.xz" \
            -o "$ARCHIVE"

          rm -rf "$LLVM_MINGW_DIR"

          tar \
            -xJf "$ARCHIVE" \
            -C toolchains

          test -x \
            "$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang"

          test -x \
            "$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang++"

          "$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang" \
            --version

      # ============================================================
      # LLVM 15
      # ============================================================

      - name: Checkout LLVM 15.0.7
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p toolchains

          rm -rf "$LLVM_SRC_DIR"

          git clone \
            --depth 1 \
            --branch "llvmorg-${LLVM_VERSION}" \
            https://github.com/llvm/llvm-project.git \
            "$LLVM_SRC_DIR"

          cd "$LLVM_SRC_DIR"

          git fetch \
            --tags \
            --depth 1 \
            origin \
            "refs/tags/llvmorg-${LLVM_VERSION}"

          git checkout --force \
            "llvmorg-${LLVM_VERSION}"

      - name: Prepare LLVM for iOS
        shell: bash
        run: |
          set -euxo pipefail

          FILE="$LLVM_SRC_DIR/llvm/cmake/modules/AddLLVM.cmake"

          if grep -q 'Darwin|iOS' "$FILE"; then
            echo "LLVM iOS patch already present."
            exit 0
          fi

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          old = 'MATCHES "Darwin"'
          new = 'MATCHES "Darwin|iOS"'

          if old not in text:
              raise SystemExit(
                  "Expected LLVM AddLLVM.cmake pattern was not found."
              )

          path.write_text(text.replace(old, new, 1))
          PY

          grep -n 'Darwin|iOS' "$FILE"

      # ============================================================
      # HOST LLVM TABLEGEN
      # ============================================================

      - name: Build host llvm-tblgen
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$LLVM_HOST_DIR"

          cmake \
            -S "$LLVM_SRC_DIR/llvm" \
            -B "$LLVM_HOST_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF

          cmake \
            --build "$LLVM_HOST_DIR" \
            --target llvm-tblgen \
            -j"$(sysctl -n hw.ncpu)"

          test -x \
            "$LLVM_HOST_DIR/bin/llvm-tblgen"

      # ============================================================
      # LLVM IOS
      # ============================================================

      - name: Build LLVM for iOS
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -rf "$LLVM_IOS_DIR"

          cmake \
            -S "$LLVM_SRC_DIR/llvm" \
            -B "$LLVM_IOS_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_C_COMPILER="$(xcrun --sdk iphoneos -f clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --sdk iphoneos -f clang++)" \
            -DCMAKE_AR="$(xcrun --sdk iphoneos -f ar)" \
            -DCMAKE_RANLIB="$(xcrun --sdk iphoneos -f ranlib)" \
            -DLLVM_TABLEGEN="$GITHUB_WORKSPACE/$LLVM_HOST_DIR/bin/llvm-tblgen" \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF

          cmake \
            --build "$LLVM_IOS_DIR" \
            -j"$(sysctl -n hw.ncpu)"

          test -d "$LLVM_IOS_DIR/lib"

      # ============================================================
      # MADEIRA NATIVE COMPONENTS
      # ============================================================

      - name: Build Madeira native components
        shell: bash
        run: |
          set -euxo pipefail

          while IFS= read -r script; do
            echo
            echo "============================================"
            echo "BUILDING: $script"
            echo "============================================"

            "$GITHUB_WORKSPACE/$script"

          done < <(
            find build \
              -type f \
              -name build.sh \
              ! -path 'build/dxmt-ios/build.sh' \
              -print \
              | sort
          )

      # ============================================================
      # DXMT
      # ============================================================

      - name: Link toolchains into DXMT
        shell: bash
        run: |
          set -euxo pipefail

          if [ -e research/dxmt/toolchains ] && \
             [ ! -L research/dxmt/toolchains ]; then
            rm -rf research/dxmt/toolchains
          fi

          if [ ! -e research/dxmt/toolchains ]; then
            ln -s \
              ../../toolchains \
              research/dxmt/toolchains
          fi

          ls -la research/dxmt/toolchains

      - name: Build DXMT PE modules
        working-directory: research/dxmt
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/$LLVM_MINGW_DIR/bin:$PATH"

          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT

          rm -rf build-pe

          meson setup \
            --cross-file build-aarch64-win.txt \
            --native-file build-osx.txt \
            -Dwine_build_path=../../wine/build-macos \
            build-pe

          meson compile \
            -C build-pe \
            -j"$(sysctl -n hw.ncpu)"

      - name: Build DXMT iOS
        working-directory: build/dxmt-ios
        shell: bash
        run: |
          set -euxo pipefail

          ./build.sh

          test -f libdxmt_unix.a

      - name: Combine DXMT libraries
        working-directory: build/dxmt-ios
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/app/Madeira"

          xcrun -sdk iphoneos libtool \
            -static \
            -o libdxmt_combined.a \
            obj/*.o \
            "$GITHUB_WORKSPACE/$LLVM_IOS_DIR/lib/"*.a

          cp \
            libdxmt_combined.a \
            "$GITHUB_WORKSPACE/app/Madeira/libdxmt_combined.a"

          test -f \
            "$GITHUB_WORKSPACE/app/Madeira/libdxmt_combined.a"

      # ============================================================
      # VERIFY NATIVE OUTPUT
      # ============================================================

      - name: Verify native outputs
        shell: bash
        run: |
          set -euxo pipefail

          echo "DXMT:"
          ls -lh app/Madeira/libdxmt_combined.a

          echo
          echo "FEX:"
          find FEX \
            -type f \
            -name '*.a' \
            -print \
            2>/dev/null \
            | head -100 || true

          echo
          echo "Madeira native libraries:"
          find app/Madeira \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*.a' \
              -o -name '*.dylib' \
              -o -name '*.dll' \
            \) \
            -print \
            2>/dev/null \
            | sort

      # ============================================================
      # XCODE BUILD
      # ============================================================

      - name: Build Madeira.app
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/DerivedData

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      # ============================================================
      # LOCATE APP
      # ============================================================

      - name: Locate Madeira.app
        id: locate-app
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(
            find build/DerivedData \
              -type d \
              -name 'Madeira.app' \
              -print \
              -quit
          )"

          if [ -z "$APP" ]; then
            echo "::error::Madeira.app was not produced."

            echo
            echo "DerivedData:"
            find build/DerivedData \
              -maxdepth 8 \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"

          echo "Found:"
          echo "$APP"

      # ============================================================
      # VERIFY APP
      # ============================================================

      - name: Verify app
        shell: bash
        run: |
          set -euxo pipefail

          APP="${{ steps.locate-app.outputs.app }}"

          test -f "$APP/Madeira"

          echo "Binary:"
          file "$APP/Madeira"

          echo
          echo "Architecture:"
          lipo -info "$APP/Madeira"

          echo
          echo "Bundle:"
          ls -la "$APP"

      # ============================================================
      # CREATE IPA
      # ============================================================

      - name: Create IPA
        shell: bash
        run: |
          set -euxo pipefail

          APP="${{ steps.locate-app.outputs.app }}"

          rm -rf Payload Madeira.ipa

          mkdir -p Payload

          cp -R \
            "$APP" \
            Payload/Madeira.app

          /usr/bin/zip \
            -r \
            -9 \
            Madeira.ipa \
            Payload

          rm -rf Payload

          test -f Madeira.ipa

          echo
          echo "============================================"
          echo "IPA CREATED"
          echo "============================================"

          ls -lh Madeira.ipa

      # ============================================================
      # VERIFY IPA
      # ============================================================

      - name: Verify IPA
        shell: bash
        run: |
          set -euxo pipefail

          unzip -t Madeira.ipa

          unzip -l Madeira.ipa \
            | grep -q 'Payload/Madeira.app/Madeira$'

          echo
          echo "IPA verification successful."

      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload Madeira IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-build-diagnostics
          path: |
            build/
            app/Madeira/
            research/dxmt/
            FEX/
          if-no-files-found: ignore
          retention-days: 7
